<div class="login-container">

  <div class="login-card">

    <h1>Sistema de Inventarios</h1>

    <h2>Iniciar sesión</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="username">
          Usuario
        </label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Ingresa tu usuario"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          required
        >

      </div>

      <button type="submit">
        Iniciar sesión
      </button>
      
    </form>

  </div>

</div>
